
services:
#Database Service
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nimcuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: nimcdb
    ports:
      - "5431:5431"
    volumes:
      - ./database/db-init.sql:/docker-entrypoint-initdb.d/init.sql
#Backend Service
  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5431
      POSTGRES_USER: nimcuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: nimcdb
    ports:
      - "5000:5000"
    depends_on:
      - db

#Frontend Service
  frontend:
    build: ./frontend
    ports:
      - "3001:3001"
    environment:
      - REACT_APP_API_URL=http://backend:5000
    depends_on:
      - backend